<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JD's Set-by-Set PPL Tracker</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #1e293b;
    --card-inner: #0f172a;
    --accent: #38bdf8;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
    --success: #22c55e;
    --input-bg: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 12px;
    line-height: 1.35;
  }
  header { text-align: center; margin-bottom: 12px; }
  h1 { font-size: 1.2rem; margin: 0 0 2px 0; color: var(--accent); font-weight: 700; }
  .subhead { font-size: 0.72rem; color: var(--muted); }
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    margin-bottom: 12px;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    white-space: nowrap;
    cursor: pointer;
    font-weight: 600;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #0b1120;
    font-weight: 700;
    border-color: var(--accent);
  }
  .workout-card { display: none; }
  .workout-card.active { display: block; }
  .exercise-box {
    background: var(--card);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .ex-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 6px;
  }
  .ex-name { font-size: 0.92rem; font-weight: 700; color: #fff; }
  .ex-target { font-size: 0.72rem; color: var(--accent); }
  .set-table {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .set-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 34px;
    gap: 8px;
    align-items: center;
    background: var(--card-inner);
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.03);
  }
  .set-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
  }
  .set-input-wrap {
    display: flex;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 6px;
  }
  .set-input-wrap span {
    font-size: 0.65rem;
    color: var(--muted);
    margin-right: 4px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .set-input-wrap input {
    width: 100%;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 0.82rem;
    font-weight: 600;
    outline: none;
    text-align: center;
  }
  .set-tick {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .set-tick input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--success);
    cursor: pointer;
    margin: 0;
  }
  .set-row.done {
    background: rgba(34, 197, 94, 0.1);
    border-color: rgba(34, 197, 94, 0.3);
  }
  .set-row.done .set-num {
    color: var(--success);
  }
  .reset-btn {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    background: transparent;
    border: 1px solid #ef4444;
    color: #ef4444;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>JD's Set-by-Set Tracker</h1>
  <div class="subhead">Log Kg & Reps for each set individually (Auto-saved)</div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchDay('d1')">Day 1: Push</button>
  <button class="tab-btn" onclick="switchDay('d2')">Day 2: Pull</button>
  <button class="tab-btn" onclick="switchDay('d3')">Day 3: Legs</button>
  <button class="tab-btn" onclick="switchDay('d4')">Day 4: Push</button>
  <button class="tab-btn" onclick="switchDay('d5')">Day 5: Pull</button>
  <button class="tab-btn" onclick="switchDay('d6')">Day 6: Legs</button>
</div>

<div id="workout-container"></div>

<button class="reset-btn" onclick="resetAll()">Reset All Logged Sets</button>

<script>
const workoutData = {
  d1: [
    { id: "d1_1", name: "Incline Dumbbell Press", target: "8-10 reps (3s eccentric)", sets: 3 },
    { id: "d1_2", name: "Flat Barbell / Machine Press", target: "8-10 reps", sets: 3 },
    { id: "d1_3", name: "Dumbbell Lateral Raises", target: "12-15 reps (Side Delts)", sets: 4 },
    { id: "d1_4", name: "Overhead Shoulder Press", target: "10-12 reps", sets: 3 },
    { id: "d1_5", name: "Rope Tricep Pushdowns", target: "12-15 reps", sets: 3 },
    { id: "d1_6", name: "Hanging Knee Raises / Planks", target: "Burn / 60s hold", sets: 3, unit: "Sec" }
  ],
  d2: [
    { id: "d2_1", name: "Lat Pulldowns / Pull-Ups", target: "8-10 reps", sets: 3 },
    { id: "d2_2", name: "Chest-Supported Row", target: "10-12 reps", sets: 3 },
    { id: "d2_3", name: "Cable Face Pulls (Rear Delts)", target: "15 reps", sets: 4 },
    { id: "d2_4", name: "Barbell / Dumbbell Curls", target: "10-12 reps", sets: 3 },
    { id: "d2_5", name: "Hammer Curls", target: "12 reps", sets: 3 },
    { id: "d2_6", name: "Stomach Vacuums", target: "20-30s hold (Waistline)", sets: 3, unit: "Sec" }
  ],
  d3: [
    { id: "d3_1", name: "Barbell Squats / Leg Press", target: "8-10 reps", sets: 3 },
    { id: "d3_2", name: "Romanian Deadlifts (RDL)", target: "10-12 reps", sets: 3 },
    { id: "d3_3", name: "Leg Extensions", target: "12-15 reps", sets: 3 },
    { id: "d3_4", name: "Lying Leg Curls", target: "12-15 reps", sets: 3 },
    { id: "d3_5", name: "Standing Calf Raises", target: "15 reps", sets: 4 }
  ],
  d4: [
    { id: "d4_1", name: "Flat Dumbbell Press", target: "8-10 reps", sets: 3 },
    { id: "d4_2", name: "Incline Cable / Machine Flyes", target: "12-15 reps", sets: 3 },
    { id: "d4_3", name: "Cable Lateral Raises", target: "12-15 reps", sets: 4 },
    { id: "d4_4", name: "Overhead Tricep Extensions", target: "12 reps", sets: 3 },
    { id: "d4_5", name: "Plank to Knee Tucks", target: "12-15 reps (Core)", sets: 3, unit: "Sec" }
  ],
  d5: [
    { id: "d5_1", name: "Seated Cable Rows", target: "8-10 reps", sets: 3 },
    { id: "d5_2", name: "Close-Grip Pulldowns", target: "10-12 reps", sets: 3 },
    { id: "d5_3", name: "Reverse Pec Deck (Rear Delts)", target: "15 reps", sets: 4 },
    { id: "d5_4", name: "Incline Dumbbell Curls", target: "10-12 reps", sets: 3 },
    { id: "d5_5", name: "Stomach Vacuums", target: "30s hold", sets: 3, unit: "Sec" }
  ],
  d6: [
    { id: "d6_1", name: "Bulgarian Split Squats", target: "8-10 reps/leg", sets: 3 },
    { id: "d6_2", name: "Hack Squat / Leg Press", target: "10-12 reps", sets: 3 },
    { id: "d6_3", name: "Seated Leg Curls", target: "12 reps", sets: 4 },
    { id: "d6_4", name: "Calf Raises", target: "15 reps", sets: 4 },
    { id: "d6_5", name: "Hanging Leg Raises", target: "Burn", sets: 3 }
  ]
};

function renderApp() {
  const container = document.getElementById('workout-container');
  let html = '';

  for (const [dayKey, exercises] of Object.entries(workoutData)) {
    html += `<div id="${dayKey}" class="workout-card ${dayKey === 'd1' ? 'active' : ''}">`;
    exercises.forEach(ex => {
      const u = ex.unit || 'Kg';
      html += `
        <div class="exercise-box">
          <div class="ex-header">
            <span class="ex-name">${ex.name}</span>
            <span class="ex-target">${ex.sets} Sets • ${ex.target}</span>
          </div>
          <div class="set-table">`;
      
      for (let s = 1; s <= ex.sets; s++) {
        const idBase = `${ex.id}_s${s}`;
        html += `
          <div class="set-row" id="row_${idBase}">
            <div class="set-num">S${s}</div>
            <div class="set-input-wrap"><span>${u}</span><input type="number" id="w_${idBase}" placeholder="-"></div>
            <div class="set-input-wrap"><span>Reps</span><input type="number" id="r_${idBase}" placeholder="-"></div>
            <div class="set-tick"><input type="checkbox" id="c_${idBase}"></div>
          </div>`;
      }

      html += `</div></div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
  bindEvents();
}

function bindEvents() {
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    const saved = localStorage.getItem('fit2_' + cb.id) === 'true';
    cb.checked = saved;
    if (saved) cb.closest('.set-row').classList.add('done');

    cb.addEventListener('change', () => {
      localStorage.setItem('fit2_' + cb.id, cb.checked);
      cb.closest('.set-row').classList.toggle('done', cb.checked);
    });
  });

  document.querySelectorAll('input[type="number"]').forEach(inp => {
    const val = localStorage.getItem('fit2_' + inp.id);
    if (val !== null) inp.value = val;

    inp.addEventListener('input', () => {
      localStorage.setItem('fit2_' + inp.id, inp.value);
    });
  });
}

function switchDay(dayId) {
  document.querySelectorAll('.workout-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(dayId).classList.add('active');
  event.target.classList.add('active');
}

function resetAll() {
  if (confirm("Kiya aap tamam sets ka data (Kg, Reps, Ticks) reset karna chahte hain?")) {
    document.querySelectorAll('input').forEach(inp => {
      if (inp.type === 'checkbox') inp.checked = false;
      else inp.value = '';
      localStorage.removeItem('fit2_' + inp.id);
    });
    document.querySelectorAll('.set-row').forEach(r => r.classList.remove('done'));
  }
}

renderApp();
</script>
</body>
</html>
